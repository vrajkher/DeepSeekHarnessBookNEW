:root {

  box-shadow: inset 0 0 0 .55rem var(--steel-2), inset 0 0 0 .7rem var(--steel-3), var(--shadow); }
.thali-center { position: absolute; inset: 34%; border-radius: 50%; display: grid; place-content: center; text-align: center; background: var(--haldi-tint); color: var(--haldi); font-family: var(--font-display); font-weight: 700; line-height: 1.15; font-size: clamp(.8rem, 2.6vw, 1rem); box-shadow: inset 0 0 0 2px var(--haldi-strong); }

  display: grid; place-content: center; text-align: center; text-decoration: none; line-height: 1.12;

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); gap: .9rem; list-style: none; padding: 0; margin: 0; }

.card { display: grid; grid-template-rows: auto auto 1fr auto; gap: .35rem; padding: 1rem 1.1rem; border-radius: 16px; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); }

/* ---------- Chapters ---------- */
.part { background: var(--surface); border: 1px solid var(--rule); border-radius: 20px; padding: clamp(1.15rem, 3.5vw, 3rem); margin-bottom: 2rem; scroll-margin-top: 1rem; }

.chapter-title { display: grid; gap: .5rem; font-size: var(--step-3); font-weight: 800; margin: 0 0 1.4rem; }
.chapter-head { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; }

.step { padding-left: .85rem; border-left: 3px solid var(--tone); }

<script>
(() => {
  const root = document.documentElement
  const store = {
    get(k) { try { return localStorage.getItem(k) } catch { return null } },
    set(k, v) { try { localStorage.setItem(k, v) } catch {} },
  }
  let size = Number(store.get('book-font')) || 17
  const applySize = () => root.style.setProperty('--base', size + 'px')
  if (store.get('book-font')) applySize()
  document.getElementById('font-up').addEventListener('click', () => { size = Math.min(22, size + 1); applySize(); store.set('book-font', size) })
  document.getElementById('font-down').addEventListener('click', () => { size = Math.max(14, size - 1); applySize(); store.set('book-font', size) })

  const toggle = document.getElementById('toc-toggle')
  const body = document.getElementById('toc-body')
  const narrow = window.matchMedia('(max-width: 920px)')
  const setOpen = open => {
    body.hidden = narrow.matches && !open
    toggle.setAttribute('aria-expanded', String(open))
    toggle.textContent = open ? '✕ વિષયસૂચિ બંધ કરો' : '☰ વિષયસૂચિ ખોલો'
  }
  setOpen(false)
  toggle.addEventListener('click', () => setOpen(body.hidden))
  narrow.addEventListener('change', () => setOpen(false))
  body.addEventListener('click', e => { if (narrow.matches && e.target.closest('a')) setOpen(false) })

  const links = new Map([...document.querySelectorAll('.nav-list > li > a[data-view]')].map(a => [a.dataset.view, a]))
  const setActive = id => { for (const [view, a] of links) a.classList.toggle('active', view === id) }
  const observer = new IntersectionObserver(entries => {
    const visible = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)
    if (visible[0]) setActive(visible[0].target.id)
  }, { rootMargin: '0px 0px -70% 0px' })
  document.querySelectorAll('section.part').forEach(s => observer.observe(s))
  setActive('top')

  const bar = document.getElementById('progress')
  const onScroll = () => {
    const max = document.documentElement.scrollHeight - window.innerHeight
    bar.style.width = (max > 0 ? Math.min(100, (window.scrollY / max) * 100) : 0) + '%'
  }
  window.addEventListener('scroll', onScroll, { passive: true })
  onScroll()

  document.querySelectorAll('.copy').forEach(btn => {
    btn.addEventListener('click', () => {
      const code = btn.closest('.code').querySelector('code')
      const done = () => { btn.textContent = 'copied'; setTimeout(() => { btn.textContent = 'copy' }, 1400) }
      const fallback = () => {
        const range = document.createRange(); range.selectNodeContents(code)
        const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range)
        btn.textContent = 'selected'
      }
      try { navigator.clipboard.writeText(code.textContent).then(done, fallback) } catch { fallback() }
    })
  })
})()
</script>
